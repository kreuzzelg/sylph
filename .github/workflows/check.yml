# Same gate as upstream colibrì (`make check`: clean + portable CPU build + C unit
# suites + Python stdlib tests), run from the subtree directory. No model downloads.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make -C 06_Code/c check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libomp
        run: brew install libomp
      - name: make check
        run: make -C 06_Code/c check

  windows:
    runs-on: windows-latest
    timeout-minutes: 45   # upstream measures ~20 min for this suite on MinGW
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2, as upstream pins it
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      # 2026-10-05: with MSYS2's gcc 16.2 the link fails with "cannot find -lgomp"
      # even without -static, i.e. the OpenMP runtime is no longer part of the gcc
      # package on this runner. Find and install whatever package now provides it,
      # and print what the package database says so the next fix is informed.
      - name: OpenMP runtime
        run: |
          ls /ucrt64/lib | grep -i gomp || echo "no libgomp in /ucrt64/lib"
          pacman -Sy --noconfirm >/dev/null 2>&1 || true
          echo "--- packages mentioning gomp/openmp:"; pacman -Ss 'gomp|openmp' | grep -i ucrt || true
          pkgs=$(pacman -Ssq 'ucrt-x86_64-(lib)?gomp$|ucrt-x86_64-openmp$' 2>/dev/null | sed 's|^ucrt64/||' || true)
          if [ -n "$pkgs" ]; then echo "installing: $pkgs"; pacman -S --noconfirm --needed $pkgs; fi
          pacman -Fy >/dev/null 2>&1 && (pacman -F ucrt64/lib/libgomp.dll.a || true)
          ls /ucrt64/lib | grep -i gomp || true
      # The Makefile links -static; a static libgomp.a may not exist here. CI only
      # needs a runnable binary, so link the OpenMP runtime dynamically (a
      # command-line variable overrides the Makefile's LDFLAGS in every sub-make).
      - name: make check
        run: make -C 06_Code/c check LDFLAGS="-lm -fopenmp -lpsapi"
