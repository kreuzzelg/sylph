# Same gate as upstream colibrì (`make check`: clean + portable CPU build + C unit
# suites + Python stdlib tests), run from the subtree directory. No model downloads.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual start from the Actions tab or the API, e.g. to re-measure the oracle without a push

env:
  # As upstream: several tests read UTF-8 sources and fixtures with read_text()
  # and no encoding; Windows Python would otherwise decode them as cp1252.
  PYTHONUTF8: '1'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make -C 06_Code/c check

  # sylph phase 3 -- the lossless oracle (07_Tests/SystemTest/lossless_oracle.md):
  # upstream's torch-built tiny Qwen3.6 fixture through the container (unchanged)
  # and through an F32 GGUF written by tools/st2gguf.py, token-exact against the
  # transformers reference at several cache capacities, plus the E1 subset
  # (PPL_DUMP vs torch log-probs). Same torch recipe as upstream's own job.
  gguf-oracle:
    name: "Linux (tiny Qwen3.6 oracle: container vs GGUF, torch reference)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 06_Code/c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r 06_Code/c/tools/oracle-requirements.txt
      - name: Tiny fixture, container, GGUFs, reference log-probs
        run: |
          cd 06_Code/c
          python3 tools/make_qwen36_tiny.py --out qwen36_tiny --ref-mode full --emit-ref qwen36_tiny/ref_full.json
          python3 tools/convert_qwen36.py --model qwen36_tiny --out qwen36_tiny_c --ebits 8
          python3 tools/st2gguf.py qwen36_tiny --out qwen36_tiny_f32.gguf --type f32
          python3 tools/st2gguf.py qwen36_tiny --out qwen36_tiny_f16.gguf --type f16
          python3 tools/st2gguf.py qwen36_tiny --out qwen36_tiny_q8_0.gguf --type q8_0 --expert-type q8_0
          python3 tools/st2gguf.py qwen36_tiny --out qwen36_tiny_xq8_0.gguf --type f32 --expert-type q8_0
          python3 ../../07_Tests/SystemTest/make_tiny_ref_logprobs.py qwen36_tiny qwen36_tiny/ref_full.json --windows 4 --full 1
      - name: Build the engine and the façade test
        run: make -C 06_Code/c qwen36 tests/test_gguf_load tests/test_tok_gguf
      - name: Façade cross-check against the torch-built snapshot (F32 bit-exact, F16 one ulp)
        run: |
          cd 06_Code/c
          ./tests/test_gguf_load qwen36_tiny_f32.gguf qwen36_tiny
          ./tests/test_gguf_load qwen36_tiny_f16.gguf qwen36_tiny --tol f16
      - name: Token-exact -- container unchanged and F32 GGUF, cache capacity 1, 2 and 8
        run: |
          cd 06_Code/c
          for cap in 1 2 8; do
            echo "::group::container cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen36_tiny_c ./qwen36 "$cap" 8 qwen36_tiny/ref_full.json
            echo "::endgroup::"
            echo "::group::GGUF F32 cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen36_tiny_f32.gguf ./qwen36 "$cap" 8 qwen36_tiny/ref_full.json
            echo "::endgroup::"
          done
      - name: Reported, not required -- F16, Q8_0 and experts-only Q8_0 GGUF and the int8 container, tokens and ΔNLL
        run: |
          cd 06_Code/c
          COLI_DENSE_I8=0 SNAP=qwen36_tiny_f16.gguf  ./qwen36 2 8 qwen36_tiny/ref_full.json || true
          COLI_DENSE_I8=0 SNAP=qwen36_tiny_q8_0.gguf ./qwen36 2 8 qwen36_tiny/ref_full.json || true
          COLI_DENSE_I8=1 SNAP=qwen36_tiny_q8_0.gguf ./qwen36 2 8 qwen36_tiny/ref_full.json || true
          for v in f16 q8_0 xq8_0; do
            echo "::group::ΔNLL $v GGUF vs torch"
            PPL=1 PPL_DUMP=dump_$v.tsv COLI_DENSE_I8=0 SNAP=qwen36_tiny_$v.gguf ./qwen36 8 8 qwen36_tiny/ref_full.json || true
            python3 ../../07_Tests/SystemTest/compare_logprobs.py qwen36_tiny/ref_logprobs.tsv dump_$v.tsv || true
            echo "::endgroup::"
          done
          echo "::group::ΔNLL int8 container vs torch"
          PPL=1 PPL_DUMP=dump_c.tsv COLI_DENSE_I8=0 SNAP=qwen36_tiny_c ./qwen36 8 8 qwen36_tiny/ref_full.json || true
          python3 ../../07_Tests/SystemTest/compare_logprobs.py qwen36_tiny/ref_logprobs.tsv dump_c.tsv || true
          echo "::endgroup::"
      - name: E1 subset -- PPL_DUMP of the F32 GGUF vs the torch log-probs (thresholds calibrated on run 13, lossless_oracle.md)
        run: |
          cd 06_Code/c
          PPL=1 PPL_DUMP=dump_f32.tsv COLI_DENSE_I8=0 SNAP=qwen36_tiny_f32.gguf ./qwen36 8 8 qwen36_tiny/ref_full.json | tee ppl.log
          nll=$(grep -oP 'TF-NLL: \K[0-9.]+' ppl.log)
          python3 ../../07_Tests/SystemTest/compare_logprobs.py qwen36_tiny/ref_logprobs.tsv dump_f32.tsv --mean 1e-6 --max 1e-5 --tf-nll "$nll"
      - name: Equivalence harness, CI subset (FR-34) -- E1/E2 incl. exact KL and E3 on the tiny model vs torch, report produced
        run: |
          cd 06_Code/c
          python3 ../../07_Tests/SystemTest/equivalence/run_equivalence.py --ci --model qwen36_tiny_f32.gguf --torch-ref qwen36_tiny --out equiv_ci
          python3 ../../07_Tests/SystemTest/equivalence/compare.py --check equiv_ci/report.json
          cat equiv_ci/report.md
      - name: Expert streaming integration test (container present here)
        run: python3 07_Tests/IntegrationTest/run_expert_streaming.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libomp
        run: brew install libomp
      - name: make check
        run: make -C 06_Code/c check

  windows:
    runs-on: windows-latest
    timeout-minutes: 45   # upstream measures ~20 min for this suite on MinGW
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # 2026-10-05: MSYS2 moved libgomp out of mingw-w64-*-gcc-libs with gcc 16.2.
      # A runner that gets gcc 16.2 from the mirror but gcc-libs 16.1 from the cache
      # has no libgomp at all ("cannot find -lgomp"); installing the new libgomp
      # package on top of gcc-libs 16.1 conflicts. A full update first (update: true)
      # puts gcc, gcc-libs and libgomp at the same version, then libgomp installs.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2, as upstream pins it
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-python
      # Diagnostic + last-resort fallback; never fails the job on its own.
      - name: OpenMP runtime
        run: |
          gcc --version | head -1
          if ls /ucrt64/lib/libgomp.dll.a >/dev/null 2>&1; then
            echo "libgomp present:"; ls /ucrt64/lib | grep -i gomp
          else
            echo "no libgomp in /ucrt64/lib; trying the split package"
            pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-libgomp || true
            ls /ucrt64/lib | grep -i gomp || echo "still no libgomp"
          fi
      # Plain `make check` as upstream runs it: the Makefile links -static, which
      # works once libgomp.a is installed (above). A command-line LDFLAGS override
      # would leak via MAKEFLAGS into the `make -n` dry runs of
      # test_makefile_platform.py and fail them.
      - name: make check
        run: make -C 06_Code/c check
